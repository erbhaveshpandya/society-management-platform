trigger:
- main
- feature/smp-mobile-app

variables:
  # The name of your Azure Resource Manager Service Connection in Azure DevOps
  azureServiceConnection: 'azure-service-connection'
  
  # Azure Resource Names
  apiAppName: 'app-societymanagement-api'
  staticWebAppName: 'swa-societymanagement-web'
  
  # Project Paths
  apiProjectPath: 'backend/SocietyManagement.Api/SocietyManagement.Api.csproj'
  webProjectPath: 'frontend/society-management-web'

stages:
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildAPI
    displayName: 'Build and Publish .NET API'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: 'restore'
        projects: '$(apiProjectPath)'

    - task: DotNetCoreCLI@2
      displayName: 'Build API Project'
      inputs:
        command: 'build'
        projects: '$(apiProjectPath)'
        arguments: '--configuration Release'

    - task: DotNetCoreCLI@2
      displayName: 'Publish API Binaries'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: '$(apiProjectPath)'
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/api-publish'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish API Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/api-publish'
        ArtifactName: 'api-drop'
        publishLocation: 'Container'

  - job: BuildFrontend
    displayName: 'Build React Frontend'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - script: |
        npm ci
      displayName: 'Install Dependencies'
      workingDirectory: '$(webProjectPath)'

    - script: |
        npm run build
      displayName: 'Compile React App'
      workingDirectory: '$(webProjectPath)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Web Artifact'
      inputs:
        PathtoPublish: '$(webProjectPath)/dist'
        ArtifactName: 'web-drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployBackend
    displayName: 'Deploy .NET API to App Service'
    pool:
      vmImage: 'windows-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Azure Web App Deploy'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux' # Change to 'webApp' if you selected Windows OS
              appName: '$(apiAppName)'
              package: '$(Pipeline.Workspace)/api-drop/*.zip'

  - deployment: DeployFrontend
    displayName: 'Deploy React Web to Static Web App'
    pool:
      vmImage: 'windows-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: web-drop
            displayName: 'Download Web Artifacts'

          # Deploying to Azure Static Web App using SWA Deploy CLI Task
          - task: AzureStaticWebApp@0
            displayName: 'Azure Static Web App Deploy'
            inputs:
              azure_static_web_apps_api_token: '$(swa_deployment_token)' # Configure this secret in your pipeline variables
              app_location: '$(Pipeline.Workspace)/web-drop'
              skip_app_build: true
              output_location: '/'
